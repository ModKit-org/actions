name: "Changelog"
description: "Generate a changelog with git-cliff. Posts an unreleased preview comment on pull requests, or prepends changes to CHANGELOG.md and opens a release PR when dispatched."
author: "ModKit-org"

branding:
  icon: book
  color: blue

inputs:
  mode:
    description: 'Operation mode. Either "preview" (post unreleased changelog as a PR comment) or "release" (prepend to CHANGELOG.md and open a release PR). If empty, defaults to "preview" on pull_request events and "release" on workflow_dispatch.'
    required: false
    default: ""
  tag-name:
    description: 'Version tag to release (e.g. v5.1.0). Required when mode is "release".'
    required: false
    default: ""
  prerelease:
    description: "Mark the upcoming release as a pre-release. Only used in release mode."
    required: false
    default: "false"
  config:
    description: "Path to the git-cliff configuration file."
    required: false
    default: ".github/cliff.toml"
  git-cliff-version:
    description: "git-cliff release version to install (without the leading v)."
    required: false
    default: "2.14.1"
  changelog-file:
    description: "Path to the changelog file to prepend to in release mode."
    required: false
    default: "CHANGELOG.md"
  pr-label:
    description: "Label applied to the release PR in release mode."
    required: false
    default: "automated"
  github-token:
    description: "Token used for posting PR comments, pushing the changelog branch, and opening the PR. Requires contents: write and pull-requests: write."
    required: true

runs:
  using: "node24"
  main: "src/main.mjs"
