name: "Changelog"
description: "Generate a changelog with git-cliff. Posts an unreleased preview comment on pull requests, or prepends changes to CHANGELOG.md and opens a release PR when dispatched."
author: "ModKit-org"

branding:
  icon: book
  color: blue

inputs:
  mode:
    description: 'Operation mode. Either "preview" (post unreleased changelog as a PR comment) or "release" (prepend to CHANGELOG.md and open a release PR). If empty, defaults to "preview" on pull_request events and "release" on workflow_dispatch.'
    required: false
    default: ""
  tag-name:
    description: 'Version tag to release (e.g. v5.1.0). Required when mode is "release".'
    required: false
    default: ""
  prerelease:
    description: "Mark the upcoming release as a pre-release. Only used in release mode."
    required: false
    default: "false"
  config:
    description: "Path to the git-cliff configuration file."
    required: false
    default: ".github/cliff.toml"
  changelog-file:
    description: "Path to the changelog file to prepend to in release mode."
    required: false
    default: "CHANGELOG.md"
  pr-label:
    description: "Label applied to the release PR in release mode."
    required: false
    default: "automated"
  github-token:
    description: "Token used for posting PR comments, pushing the changelog branch, and opening the PR. Requires contents: write and pull-requests: write."
    required: true

runs:
  using: "composite"
  steps:
    - name: Resolve effective mode
      id: resolve
      shell: bash
      env:
        INPUT_MODE: ${{ inputs.mode }}
        EVENT_NAME: ${{ github.event_name }}
        TAG: ${{ inputs.tag-name }}
      run: |
        MODE="$INPUT_MODE"
        if [ -z "$MODE" ]; then
          if [ "$EVENT_NAME" = "pull_request" ]; then
            MODE="preview"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            MODE="release"
          else
            echo "::error::Unable to auto-detect mode for event '$EVENT_NAME'. Set the 'mode' input explicitly to 'preview' or 'release'."
            exit 1
          fi
        fi
        if [ "$MODE" != "preview" ] && [ "$MODE" != "release" ]; then
          echo "::error::Invalid mode '$MODE'. Allowed values: preview, release."
          exit 1
        fi
        if [ "$MODE" = "release" ] && [ -z "$TAG" ]; then
          echo "::error::Input 'tag-name' is required when mode is 'release'."
          exit 1
        fi
        echo "mode=$MODE" >> "$GITHUB_OUTPUT"

    - name: Fetch full git history and tags
      shell: bash
      run: |
        git fetch --unshallow 2>/dev/null || true
        git fetch --tags --force

    # ---------- preview mode ----------
    - name: Generate unreleased changelog preview
      if: steps.resolve.outputs.mode == 'preview'
      id: preview
      uses: orhun/git-cliff-action@v4
      with:
        config: ${{ inputs.config }}
        args: --verbose --unreleased --strip header -vv
      env:
        OUTPUT: PREVIEW.md
        GITHUB_REPO: ${{ github.repository }}

    - name: Read preview content
      if: steps.resolve.outputs.mode == 'preview'
      id: read_preview
      shell: bash
      run: |
        if [ -s PREVIEW.md ]; then
          CONTENT=$(cat PREVIEW.md)
        else
          CONTENT="_No unreleased changes detected._"
        fi
        echo "content<<CLIFF_EOF" >> "$GITHUB_OUTPUT"
        echo "$CONTENT" >> "$GITHUB_OUTPUT"
        echo "CLIFF_EOF" >> "$GITHUB_OUTPUT"

    - name: Post or update PR comment
      if: steps.resolve.outputs.mode == 'preview'
      uses: actions/github-script@v7
      env:
        PREVIEW_CONTENT: ${{ steps.read_preview.outputs.content }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const marker = '<!-- git-cliff-preview -->';
          const body = `${marker}\n## Changelog preview\n\n${process.env.PREVIEW_CONTENT}`;
          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
          });
          const existing = comments.find(c => c.body.includes(marker));
          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body,
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
          }

    # ---------- release mode ----------
    - name: Validate tag does not already exist
      if: steps.resolve.outputs.mode == 'release'
      shell: bash
      env:
        TAG: ${{ inputs.tag-name }}
      run: |
        if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
          echo "::error::Tag $TAG already exists. Use a different version."
          exit 1
        fi

    - name: Prepend latest changes to changelog
      if: steps.resolve.outputs.mode == 'release'
      uses: orhun/git-cliff-action@v4
      with:
        config: ${{ inputs.config }}
        args: --verbose --tag ${{ inputs.tag-name }} --unreleased --prepend ${{ inputs.changelog-file }}
      env:
        GITHUB_REPO: ${{ github.repository }}

    - name: Create changelog PR
      if: steps.resolve.outputs.mode == 'release'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        TAG: ${{ inputs.tag-name }}
        PRERELEASE: ${{ inputs.prerelease }}
        CHANGELOG_FILE: ${{ inputs.changelog-file }}
        PR_LABEL: ${{ inputs.pr-label }}
        CLIFF_CONFIG: ${{ inputs.config }}
      run: |
        # Check if the changelog file was actually modified
        if git diff --quiet -- "$CHANGELOG_FILE"; then
          echo "::error::No changelog changes detected for $TAG."
          echo "::error::Possible causes:"
          echo "::error::  - No unreleased commits exist since the last tag"
          echo "::error::  - All commits since the last tag were filtered out by cliff.toml commit_parsers"
          echo "::error::  - Commits use non-conventional format and are caught by the catch-all skip rule"
          echo "::error::Run 'git-cliff --unreleased --config $CLIFF_CONFIG -vv' locally to debug"
          exit 1
        fi

        BRANCH_NAME="changelog/$TAG"

        # Create the branch via the API
        BASE_SHA=$(gh api \
          "/repos/$GITHUB_REPOSITORY/git/ref/heads/$GITHUB_REF_NAME" --jq '.object.sha')
        gh api \
          --method POST \
          "/repos/$GITHUB_REPOSITORY/git/refs" \
          -f ref="refs/heads/$BRANCH_NAME" \
          -f sha="$BASE_SHA" > /dev/null

        # Read the updated changelog content
        CONTENT=$(base64 -w 0 < "$CHANGELOG_FILE")

        # Check if the file already exists on the base branch
        EXISTING_SHA=$(gh api \
          "/repos/$GITHUB_REPOSITORY/contents/$CHANGELOG_FILE?ref=$BASE_SHA" \
          --jq '.sha' 2>/dev/null || echo "")

        # Commit via the Contents API for a verified bot signature
        if [ -n "$EXISTING_SHA" ]; then
          gh api \
            --method PUT \
            "/repos/$GITHUB_REPOSITORY/contents/$CHANGELOG_FILE" \
            -f message="chore(release): update $CHANGELOG_FILE for $TAG" \
            -f content="$CONTENT" \
            -f sha="$EXISTING_SHA" \
            -f branch="$BRANCH_NAME" > /dev/null
        else
          gh api \
            --method PUT \
            "/repos/$GITHUB_REPOSITORY/contents/$CHANGELOG_FILE" \
            -f message="chore(release): update $CHANGELOG_FILE for $TAG" \
            -f content="$CONTENT" \
            -f branch="$BRANCH_NAME" > /dev/null
        fi

        BODY="Automated changelog update for release **$TAG**."
        BODY="$BODY"$'\n\n'"Once this PR is merged, the tag and GitHub release will be created automatically."
        if [ "$PRERELEASE" = "true" ]; then
          BODY="$BODY"$'\n\n'"> **Pre-release**: this version will be marked as a pre-release."
        fi

        gh pr create \
          --base "$GITHUB_REF_NAME" \
          --head "$BRANCH_NAME" \
          --title "chore(release): update $CHANGELOG_FILE for $TAG" \
          --body "$BODY" \
          --label "$PR_LABEL"
